# CloudBoard — Microservices Compose File
# =========================================
# All environment variables are sourced from .env
#
# Service layout:
#   web              — Flask UI (Jinja2), no Redis access, port 8080
#   student-service  — REST JSON API, owns student registration/listing
#   stats-service    — REST JSON API, owns visitor tracking & stats
#   reset-service    — REST JSON API, owns destructive FLUSHALL
#   redis            — Shared data store (all backend services connect directly)
#   redis-commander  — Web GUI for inspecting Redis keys, port 8081

services:

  # ── Web (UI layer) ──────────────────────────────────────────────────────
  web:
    build:
      context: ./services/web
      dockerfile: Dockerfile
    container_name: cloudboard_web
    ports:
      - "${WEB_HOST_PORT}:${WEB_PORT}"
    environment:
      APP_NAME: ${APP_NAME}
      APP_GREETING: ${APP_GREETING}
      FLASK_PORT: ${WEB_PORT}
      STUDENT_SERVICE_URL: ${STUDENT_SERVICE_URL}
      STATS_SERVICE_URL: ${STATS_SERVICE_URL}
      RESET_SERVICE_URL: ${RESET_SERVICE_URL}
    depends_on:
      - student-service
      - stats-service
      - reset-service
    networks:
      - cloudboard-net

  # ── Student Service ──────────────────────────────────────────────────────
  student-service:
    build:
      context: ./services/student-service
      dockerfile: Dockerfile
    container_name: cloudboard_student
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      FLASK_PORT: ${STUDENT_PORT}
    depends_on:
      - redis
    networks:
      - cloudboard-net

  # ── Stats Service ────────────────────────────────────────────────────────
  stats-service:
    build:
      context: ./services/stats-service
      dockerfile: Dockerfile
    container_name: cloudboard_stats
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      FLASK_PORT: ${STATS_PORT}
    depends_on:
      - redis
    networks:
      - cloudboard-net

  # ── Reset Service ────────────────────────────────────────────────────────
  reset-service:
    build:
      context: ./services/reset-service
      dockerfile: Dockerfile
    container_name: cloudboard_reset
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      FLASK_PORT: ${RESET_PORT}
    depends_on:
      - redis
    networks:
      - cloudboard-net

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:alpine
    container_name: cloudboard_redis
    command: redis-server --save 60 1 --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - cloudboard-net

  # ── Redis Commander (Web GUI) ────────────────────────────────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: cloudboard_commander
    environment:
      - REDIS_HOSTS=ikenna:${REDIS_HOST}:${REDIS_PORT}
    ports:
      - "${REDIS_COMMANDER_HOST_PORT}:8081"
    depends_on:
      - redis
    networks:
      - cloudboard-net

# ── Persistent Volumes ──────────────────────────────────────────────────────
volumes:
  redis-data:
    driver: local

# ── Isolated Network ────────────────────────────────────────────────────────
networks:
  cloudboard-net:
    driver: bridge
