server {
    listen 80;

    # Serve the single page frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # Proxy requests to the Ticket API.
    # TICKET_API_URL is injected at container startup via envsubst.
    location /api/tickets {
        rewrite ^/api/tickets(.*) /tickets$1 break;
        proxy_pass ${TICKET_API_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy requests to the Notification service.
    # NOTIFICATION_SERVICE_URL is injected at container startup via envsubst.
    location /api/notifications {
        rewrite ^/api/notifications(.*) /notifications$1 break;
        proxy_pass ${NOTIFICATION_SERVICE_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
